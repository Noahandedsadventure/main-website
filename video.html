    <header class="relative w-full border-b-[6px] border-cn-red py-20 px-4 text-center bg-gradient-to-b from-cn-black to-cn-base">
        <p class="text-cn-red font-oswald tracking-[0.2em] uppercase text-sm mb-4">On the Line</p>
        <h1 class="text-4xl md:text-6xl font-oswald font-bold text-white uppercase">Our Videos</h1>
        <p class="text-gray-300 text-lg max-w-2xl mx-auto mt-5">Browse and play videos from Noah & Ed's Train Adventures.</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-2 h-8 bg-cn-red"></div>
            <div>
                <h2 class="text-3xl font-oswald font-bold text-white uppercase tracking-wide">YouTube Video Library</h2>
                <p id="video-count" class="text-cn-muted mt-1" aria-live="polite">Loading videos...</p>
            </div>
        </div>

        <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" aria-live="polite"></div>

        <div class="mt-10 text-center">
            <p id="video-message" class="text-gray-300 mb-5" role="status"></p>
            <button id="load-more" type="button" class="hidden bg-cn-red hover:bg-cn-darkred text-white font-oswald font-bold uppercase tracking-widest px-8 py-3 rounded-md transition-colors disabled:opacity-60 disabled:cursor-wait">Load More Videos</button>
        </div>
    </main>

    <footer class="bg-cn-black border-t border-[#222] py-8 text-center mt-auto">
        <div class="max-w-4xl mx-auto px-4">
            <h4 class="font-oswald text-xl text-white uppercase tracking-wider mb-2">Noah & Ed's Train Adventures</h4>
            <p class="text-cn-muted text-sm font-light uppercase tracking-widest">&copy; 2026 Documenting CN Power.</p>
        </div>
    </footer>

    <script>
        const API_KEY = 'AIzaSyDzXrJHFeiuBP5w6H7pT6KGrFY7q_UGn4A';
        const CHANNEL_ID = 'UCzDVvHcpWnu510JRLGnK-qg';
        const UPLOADS_PLAYLIST_ID = `UU${CHANNEL_ID.slice(2)}`;
        const videoGrid = document.getElementById('video-grid');
        const videoCount = document.getElementById('video-count');
        const videoMessage = document.getElementById('video-message');
        const loadMoreButton = document.getElementById('load-more');
        let nextPageToken = '';
        let loadedVideoCount = 0;

        function getVideoType(video) {
            const title = video.snippet?.title || '';
            const description = video.snippet?.description || '';
            const tags = video.snippet?.tags || [];
            if (video.liveStreamingDetails
                || ['live', 'upcoming'].includes(video.snippet?.liveBroadcastContent)
                || /\blive(?:\s*stream)?\b/i.test(title)) {
                return 'Live Stream';
            }

            const durationMatch = (video.contentDetails?.duration || '').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (durationMatch) {
                const durationInSeconds = Number(durationMatch[1] || 0) * 3600
                    + Number(durationMatch[2] || 0) * 60
                    + Number(durationMatch[3] || 0);
                return durationInSeconds <= 90 ? 'Short Video' : 'Video';
            }

            const hasShortMarker = /#shorts?\b|\byoutube shorts?\b/i.test(`${title} ${description}`)
                || tags.some(tag => /^shorts?$/i.test(tag));
            return hasShortMarker ? 'Short Video' : 'Video';
        }

        function getPartLabel(title) {
            const match = title.match(/\b(?:part|pt\.?|episode|ep\.?)\s*#?(\d+)(?:\s*(?:of|\/)\s*(\d+))?\b/i);
            if (!match) return '';

            const labelType = /\b(?:episode|ep\.?)\b/i.test(match[0]) ? 'Episode' : 'Part';
            return `${labelType} ${match[1]}${match[2] ? ` of ${match[2]}` : ''}`;
        }

        async function fetchVideoDetails(videoIds) {
            if (!videoIds.length) return new Map();

            const params = new URLSearchParams({
                part: 'snippet,contentDetails,liveStreamingDetails',
                id: videoIds.join(','),
                key: API_KEY
            });
            const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?${params}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || 'Could not load video types');

            return new Map((data.items || []).map(video => [video.id, video]));
        }

        function createVideoCard(video, videoDetails) {
            const videoId = video.snippet.resourceId.videoId;
            const title = video.snippet.title || 'Untitled video';
            const videoMetadata = videoDetails || video;
            const videoType = getVideoType(videoMetadata);
            const partLabel = getPartLabel(title);
            const thumbnailUrl = video.snippet.thumbnails?.high?.url
                || video.snippet.thumbnails?.medium?.url
                || video.snippet.thumbnails?.default?.url;
            const publishedDate = new Date(video.snippet.publishedAt).toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const card = document.createElement('article');
            card.className = 'bg-cn-card border border-cn-border rounded-xl overflow-hidden shadow-lg hover:border-cn-red/50 transition-colors';

            const media = document.createElement('div');
            media.className = 'video-media relative aspect-video bg-cn-base';

            if (thumbnailUrl) {
                const image = document.createElement('img');
                image.src = thumbnailUrl;
                image.alt = '';
                image.loading = 'lazy';
                image.className = 'absolute inset-0 w-full h-full object-cover';
                image.addEventListener('error', () => image.remove(), { once: true });
                media.append(image);
            }

            const playButton = document.createElement('button');
            playButton.type = 'button';
            playButton.className = 'absolute inset-0 w-full h-full flex items-center justify-center bg-black/25 hover:bg-black/45 transition-colors text-white';
            playButton.setAttribute('aria-label', `Play ${title}`);
            playButton.innerHTML = '<span class="w-16 h-16 rounded-full bg-cn-red flex items-center justify-center text-2xl shadow-lg" aria-hidden="true">▶</span>';
            playButton.addEventListener('click', () => {
                const player = document.createElement('iframe');
                player.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1`;
                player.title = title;
                player.className = 'absolute inset-0 w-full h-full border-0';
                player.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                player.allowFullscreen = true;
                media.replaceChildren(player);
            }, { once: true });
            media.append(playButton);

            const details = document.createElement('div');
            details.className = 'p-5 border-t border-cn-border';

            const heading = document.createElement('h3');
            heading.className = 'font-bold text-white line-clamp-2 leading-snug';
            heading.textContent = title;

            const date = document.createElement('p');
            date.className = 'text-cn-muted text-sm mt-3';
            date.textContent = publishedDate;

            const badgeRow = document.createElement('div');
            badgeRow.className = 'flex flex-wrap items-center gap-2 mt-3';

            const typeBadge = document.createElement('span');
            typeBadge.className = videoType === 'Live Stream'
                ? 'inline-block mt-3 bg-cn-red/15 border border-cn-red/50 text-cn-red px-2.5 py-1 rounded text-xs font-oswald uppercase tracking-widest'
                : 'inline-block mt-3 bg-white/5 border border-cn-border text-gray-300 px-2.5 py-1 rounded text-xs font-oswald uppercase tracking-widest';
            typeBadge.classList.remove('mt-3');
            typeBadge.textContent = videoType;
            badgeRow.append(typeBadge);

            if (partLabel) {
                const partBadge = document.createElement('span');
                partBadge.className = 'inline-block bg-cn-base border border-cn-border text-cn-muted px-2.5 py-1 rounded text-xs font-oswald uppercase tracking-widest';
                partBadge.textContent = partLabel;
                badgeRow.append(partBadge);
            }

            const watchLink = document.createElement('a');
            watchLink.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
            watchLink.target = '_blank';
            watchLink.rel = 'noopener noreferrer';
            watchLink.className = 'inline-block text-xs text-cn-red hover:text-white mt-4 font-oswald uppercase tracking-widest border-t border-[#333] pt-3 w-full';
            watchLink.textContent = 'Watch on YouTube';

            details.append(heading, date, badgeRow, watchLink);
            card.append(media, details);
            return card;
        }

        async function loadVideos() {
            loadMoreButton.disabled = true;
            loadMoreButton.textContent = 'Loading...';
            videoMessage.textContent = '';

            const params = new URLSearchParams({
                part: 'snippet,status',
                playlistId: UPLOADS_PLAYLIST_ID,
                maxResults: '50',
                key: API_KEY
            });
            if (nextPageToken) params.set('pageToken', nextPageToken);

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?${params}`);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error?.message || `YouTube API request failed (${response.status})`);
                }

                const videos = (data.items || []).filter(video => {
                    const title = video.snippet?.title || '';
                    return video.snippet?.resourceId?.videoId
                        && !/\b(private video|deleted video|removed video|video unavailable)\b/i.test(title);
                });
                let videoDetails = new Map();
                try {
                    videoDetails = await fetchVideoDetails(videos.map(video => video.snippet.resourceId.videoId));
                } catch (error) {
                    videoMessage.textContent = 'Video types could not be checked right now; the videos are still available below.';
                }
                videoGrid.append(...videos.map(video => {
                    const videoId = video.snippet.resourceId.videoId;
                    return createVideoCard(video, videoDetails.get(videoId));
                }));
                loadedVideoCount += videos.length;
                nextPageToken = data.nextPageToken || '';
                videoCount.textContent = `${loadedVideoCount} video${loadedVideoCount === 1 ? '' : 's'} loaded`;
                loadMoreButton.classList.toggle('hidden', !nextPageToken);
                if (!loadedVideoCount) videoMessage.textContent = 'No public videos were found for this channel.';
                else if (!nextPageToken) videoMessage.textContent = 'You\'re all caught up.';
            } catch (error) {
                videoMessage.textContent = `Could not load videos: ${error.message}. You can also browse the channel on YouTube.`;
                if (!loadedVideoCount) {
                    const channelLink = document.createElement('a');
                    channelLink.href = 'https://www.youtube.com/@NoahandEdsTrainadventures';
                    channelLink.target = '_blank';
                    channelLink.rel = 'noopener noreferrer';
                    channelLink.className = 'text-cn-red hover:text-white underline';
                    channelLink.textContent = 'Open the YouTube channel';
                    videoMessage.append(' ', channelLink);
                }
                loadMoreButton.classList.toggle('hidden', !nextPageToken);
            } finally {
                loadMoreButton.disabled = false;
                loadMoreButton.textContent = 'Load More Videos';
            }
        }

        loadMoreButton.addEventListener('click', loadVideos);
        loadVideos();
    </script>
</body>
