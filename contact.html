<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit an Idea | Noah & Ed's Train Adventures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-cn-base text-cn-text">
    <nav class="sticky top-0 z-50 bg-cn-black/95 backdrop-blur-sm border-b border-cn-red px-6 py-4 shadow-lg shadow-black/50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <a href="index.html" class="font-oswald text-2xl font-bold text-white tracking-wider uppercase hover:text-cn-red transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-cn-red"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
                Noah & Ed's
            </a>
            <div class="flex flex-wrap justify-center gap-2 md:gap-6 font-oswald tracking-wide">
                <a href="index.html" class="nav-btn text-cn-muted hover:text-white pb-1 transition-colors uppercase text-sm md:text-base font-medium">Home</a>
                <a href="about.html" class="nav-btn text-cn-muted hover:text-white pb-1 transition-colors uppercase text-sm md:text-base font-medium">About Us</a>
                <a href="sprague-sub.html" class="nav-btn text-cn-muted hover:text-white pb-1 transition-colors uppercase text-sm md:text-base font-medium">Sprague Sub Guide</a>
                <a href="gear.html" class="nav-btn text-cn-muted hover:text-white pb-1 transition-colors uppercase text-sm md:text-base font-medium">Scanner & Gear</a>
                <a href="contact.html" class="nav-btn active text-white pb-1 transition-colors uppercase text-sm md:text-base font-medium">Submit Idea</a>
                <a href="merch.html" class="nav-btn text-cn-muted hover:text-white pb-1 transition-colors uppercase text-sm md:text-base font-medium">MERCH</a>
                <a href="gallery.html" class="nav-btn text-cn-muted hover:text-white pb-1 transition-colors uppercase text-sm md:text-base font-medium">Gallery</a>
                <a id="live-nav-link" href="live.html" class="live-stream-link uppercase text-sm md:text-base">🔴 LIVE STREAM</a>
            </div>
        </div>
    </nav>

    <header class="relative border-b-[6px] border-cn-red py-20 px-4 text-center bg-gradient-to-b from-cn-black to-cn-base">
        <p class="text-cn-red font-oswald tracking-[0.2em] uppercase text-sm mb-4">Talk Trackside</p>
        <h1 class="text-4xl md:text-6xl font-oswald font-bold text-white uppercase">Submit a Video Idea</h1>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12">
        <section class="bg-cn-card border border-cn-border rounded-xl p-8 shadow-xl">
            <p class="text-gray-400 text-lg text-center mb-8">Know a great location, spotted an interesting consist, or have a video idea? Send it to the crew.</p>
            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                <input type="hidden" name="access_key" value="b50a8281-5ad6-4642-9740-d7fcd97b515c">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-oswald uppercase tracking-wide text-gray-400 mb-2">Your Name / Handle</label>
                        <input type="text" id="name" name="name" required class="w-full bg-cn-base border border-cn-border rounded-md px-4 py-3 text-white focus:outline-none focus:border-cn-red focus:ring-1 focus:ring-cn-red">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-oswald uppercase tracking-wide text-gray-400 mb-2">Contact Email</label>
                        <input type="email" id="email" name="email" required class="w-full bg-cn-base border border-cn-border rounded-md px-4 py-3 text-white focus:outline-none focus:border-cn-red focus:ring-1 focus:ring-cn-red">
                    </div>
                </div>
                <div>
                    <label for="message" class="block text-sm font-oswald uppercase tracking-wide text-gray-400 mb-2">Train Tip / Location Details</label>
                    <textarea id="message" name="message" rows="6" required class="w-full bg-cn-base border border-cn-border rounded-md px-4 py-3 text-white focus:outline-none focus:border-cn-red focus:ring-1 focus:ring-cn-red resize-y"></textarea>
                </div>
                <button type="submit" class="w-full bg-cn-red hover:bg-cn-darkred text-white font-oswald font-bold uppercase tracking-widest py-4 rounded-md transition-all hover:-translate-y-0.5">Send to the Crew</button>
            </form>
        </section>
    </main>

    <footer class="bg-cn-black border-t border-[#222] py-8 text-center mt-auto">
        <h4 class="font-oswald text-xl text-white uppercase tracking-wider mb-2">Noah & Ed's Train Adventures</h4>
        <p class="text-cn-muted text-sm uppercase tracking-widest">&copy; 2026 Documenting CN Power.</p>
    </footer>
</body>
</html>
